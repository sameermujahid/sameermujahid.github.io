    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);

        var source = params.get("utm_source");
        var medium = params.get("utm_medium");
        var campaign = params.get("utm_campaign");
        var content = params.get("utm_content");
        var sourcePlatform = params.get("utm_source_platform");
        var term = params.get("utm_term");

        // Only create a campaign event when all required
        // UTM parameters are present.
        if (source && medium && campaign) {
          window.dataLayer.push({
            event: "social_landing",

            social_source: source,
            social_medium: medium,
            social_campaign: campaign,
            social_content: content || "(not set)",
            social_source_platform: sourcePlatform || "(not set)",
            social_term: term || "(not set)",

            landing_page: window.location.href,
            page_path: window.location.pathname,
            page_title: document.title
          });

      })();
