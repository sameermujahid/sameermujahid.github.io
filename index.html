<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>Sameer Mujahid</title>

    <!-- Google tag (gtag.js) - GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-06E2ZWX0FD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }

      gtag('js', new Date());
      gtag('config', 'G-06E2ZWX0FD');

      // Record a tagged social-media landing visit.
      // This is a website arrival event, not a click inside the social app.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var source = params.get('utm_source');
        var medium = params.get('utm_medium');
        var campaign = params.get('utm_campaign');
        var content = params.get('utm_content');
        var sourcePlatform = params.get('utm_source_platform');

        if (source && medium && campaign) {
          gtag('event', 'social_landing', {
            social_source: source,
            social_medium: medium,
            social_campaign: campaign,
            social_content: content || '(not set)',
            social_source_platform: sourcePlatform || '(not set)'
          });
        }
      })();
    </script>
    <!-- End Google tag -->

    <style>
      html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #050505;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #050505;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
        background: transparent;
      }
      .route-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #050505;
      }
      .route-loader-glow {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(120, 90, 255, 0.10);
        filter: blur(60px);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
