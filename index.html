<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#050505"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/vite.svg"
    />

    <title>Sameer Mujahid</title>

    <style>
      html {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #050505;
        color-scheme: dark;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #050505;
        color: #ffffff;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
        background: #050505;
      }

      .route-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% 40%,
            rgba(120, 90, 255, 0.08),
            transparent 34%
          ),
          #050505;
      }

      .route-loader-glow {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(120, 90, 255, 0.10);
        filter: blur(60px);
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
